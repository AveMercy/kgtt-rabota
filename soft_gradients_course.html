e-between;align-items:center;margin-bottom:auto}.bottomline{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:2%;font-size:clamp(9px,.9vw,13px);color:var(--muted);font-weight:700}.pillbtn,.softbtn{border:0;border-radius:999px;padding:11px 17px;background:var(--accent);color:white;font-size:clamp(10px,1vw,14px);font-weight:800;transition:transform .2s,filter .2s}.pillbtn:hover,.softbtn:hover{transform:translateY(-2px);filter:brightness(1.07)}.softbtn{background:#fff;color:var(--ink);border:1px solid #e5dff0}.controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#29283eea;color:white;display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:100px;z-index:20;box-shadow:0 10px 40px #0004;backdrop-filter:blur(15px)}.controls button{background:#ffffff17;color:white;border:1px solid #ffffff22;border-radius:100px;padding:8px 12px}.controls button:hover{background:#ffffff33}.controls span{font-size:12px;min-width:64px;text-align:center}.progress{position:absolute;bottom:0;left:0;height:5px;background:var(--accent);transition:width .35s;z-index:10}.dots{display:flex;gap:8px}.dot{height:13px;width:13px;border-radius:50%;background:#ddd}.code{background:#27283c;color:#e9eaff;border-radius:16px;padding:20px;white-space:pre-wrap;font:clamp(10px,1.05vw,16px)/1.65 ui-monospace,monospace;overflow:auto}.code textarea{width:100%;height:170px;resize:vertical;background:transparent;color:#e9eaff;border:0;outline:none;font:inherit}.preview{background:white;border-radius:14px;padding:18px;min-height:120px;border:1px solid #eee}.compare{position:relative;overflow:hidden;border-radius:20px;height:65%;min-height:180px;background:#fff;display:flex}.compare .bad,.compare .good{width:50%;padding:24px;overflow:hidden}.compare .bad{background:#e9ff2f;color:red;font-family:serif}.compare .good{background:#f8f6ff}.compare .bad h3{font-size:36px;text-shadow:3px 3px blue}.compare .good h3{font-size:32px;letter-spacing: e:12px}.checkline{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:clamp(11px,1vw,15px)}.checkline input{accent-color:var(--accent)}.timer{font-size:clamp(50px,9vw,120px);font-weight:800;letter-spacing:-.08em}.presenter .note{margin-top:10px}.slide img{max-width:100%}@media(max-width:700px){.app{padding:5px 5px 90px;min-height:100svh}.deck{width:100%;border-radius:8px}.slide{padding:5% 6% 7%}.panel{border-radius:10px;padding:9px}.visual{min-height:80px;border-radius:12px}.tag{padding:4px 7px}.code{padding:8px;border-radius:8px}.code textarea{height:70px}.option{padding:5px 8px;margin:3px 0}.pillbtn,.softbtn{padding:5px 9px}.compare{min-height:70px}.compare .bad,.compare .good{padding:7px}.compare .bad h3,.compare .good h3{font-size:15px}.hero-mock{min-height:70px;padding:8px}.controls{bottom:10px;gap:4px;padding:6px}.controls button{padding:7px 9px}}@media print{@page{size:landscape;margin:0}html,body{background:white!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}.app{display:block;padding:0!important}.deck{width:100vw!important;height:100vh!important;aspect-ratio:auto;overflow:visible;box-shadow:none;border-radius:0}.slide,.slide.active{position:relative;display:flex!important;width:100vw;height:100vh;overflow:hidden;page-break-after:always;break-after:page;animation:none!important}.deck{height:auto!important}.ambient{position:fixed;inset:0}.orb,.visual:after{animation:none!important}.controls,.presenter,.progress,.no-print{display:none!important}.reveal{opacity:1!important;transform:none!important}}
</style></head><body><main class="app"><div class="deck" id="deck" data-theme="1"><div class="ambient"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div><div id="slides"></div><div class="progress" id="progress"></div></div></main><div class="controls no-print"><button id="prev" title="Назад (←)">←</button><span id="counter">01 / 18</span><button id="next" title="Вперёд (→)">→</button><button id="overview" title="Карта слайдов">☷</button><button id="presenterBtn" title="Заметки преподавателя">♧</button><button id="editBtn" title="Редактировать текст">✎</button><button id="motionBtn" title="Включить/выключить движение">◌</button><button id="fullBtn" title="Полный экран">⛶</button><button id="printBtn" title="Сохранить PDF">PDF</button></div><aside class="presenter" id="presenter"><h3>Заметки преподавателя</h3><p id="note"></p><button onclick="document.getElementById('presenter').classList.remove('visible')">Закрыть</button></aside><script>
/* COURSE CONFIG: change titles, lesson number and theme here. Themes: 1 Visual, 2 Web, 3 UX, 4 Project. */
const COURSE={name:'FORM / FUNCTION',lesson:1,totalLessons:25,theme:1,subtitle:'Веб-дизайн: от идеи до сайта'};
const foot=(left='FORM / FUNCTION · КУРС ВЕБ-ДИЗАЙНА')=>`<div class="bottomline"><span>${left}</span><span>LESSON ${String(COURSE.lesson).padStart(2,'0')} / ${COURSE.totalLessons}</span></div>`;
const slides=[
{type:'cover',note:'Начните с вопроса: что делает сайт красивым и удобным?',html:`<div class="topline"><b class="tag">✳ FORM / FUNCTION</b><span class="annotation">WEB DESIGN / 2026</span></div><div class="eyebrow">КУРС ВЕБ-ДИЗАЙНА · 25 ЗАНЯТИЙ</div><h1>От первого<br><span class="grad">пикселя</span> до<br>своего сайта.</h1><p class="lead">Дизайн, который хочется создавать.</p><div class="bottomline"><span>SCROLL LESS. CREATE MORE. ✳</span><span>01 / 25</span></div>`},
{type:'statement',note:'Попросите студентов привести примеры дизайна, который помогает или мешает.',html:`<div class="eyebrow">01 / BIG STATEMENT</div><div style="margin:auto 0"><h1>Красиво — это<br>хорошо.<br><span class="grad">Понятно — ещё лучше.</span></h1><p class="lead">Дизайн — это не только внешний вид. Это опыт человека.</p></div>${foot()}`},
{type:'shock',note:'Обсудите 3 причины, почему один из двух вариантов воспринимается лучше.',html:`<div class="eyebrow">02 / VISUAL SHOCK</div><h2>Один продукт. Два впечатления.</h2><div class="compare"><div class="bad"><h3>СУПЕР САЙТ!!!</h3><p style="color:red;font-size:15px">КУПИ СЕЙЧАС! ЛУЧШАЯ КНОПКА!</p><button style="background:blue;color:yellow;border:5px dotted red">НАЖМИ!!!</button></div><div class="good"><span class="tag">studio / good design</span><h3>Простота,<br>которая работает.</h3><p>Продуманный опыт. Без лишнего шума.</p><button class="pillbtn">Подробнее →</button></div></div>${foot('ВОПРОС: ЧТО ИМЕННО МЫ ИЗМЕНИЛИ?')}`},
{type:'chapter',note:'Используйте этот тип как разделитель внутри лекции.',html:`<div class="eyebrow">CHAPTER / 01</div><div class="split"><div><div class="big-number">01.</div><h2>Визуал<br>и «вау»</h2><p>Сначала вдохновляемся. Потом создаём.</p><span class="tag">ЗАНЯТИЯ 1–5</span></div><div class="visual" style="height:80%;min-height:180px"><span style="position:absolute;z-index:1;font-size:clamp(45px,9vw,130px);color:white">✳</span></div></div>${foot()}`},
{type:'explainer',note:'Покажите принцип иерархии: размер, контраст, пространство.',html:`<div class="eyebrow">03 / VISUAL EXPLAINER</div><h2>Иерархия направляет взгляд.</h2><div class="grid2" style="flex:1"><div class="panel" style="display:flex;flex-direction:column;justify-content:center"><span class="annotation">УРОВЕНЬ 01</span><h2 style="font-size:clamp(28px,5vw,70px)">Главное.</h2><span class="annotation">УРОВЕНЬ 02</span><h3>Второстепенное</h3><span class="annotation">УРОВЕНЬ 03</span><p class="small">Детали и поясняющий текст читаются последними.</p></div><div class="panel" style="display:grid;align-content:center;gap:15px"><div style="height:22%;background:#9e81e5;border-radius:14px"></div><div style="height:14%;width:72%;background:#c6b4ed;border-radius:12px"></div><div style="height:8%;width:92%;background:#ded4f2;border-radius:10px"></div><div style="height:8%;width:60%;background:#ded4f2;border-radius:10px"></div></div></div>${foot()}`},
{type:'anatomy',note:'Нажимайте на части сайта, чтобы показать их роль.',html:`<div class="eyebrow">04 / INTERACTIVE ANATOMY</div><h2>Из чего состоит сайт?</h2><div class="grid2" style="flex:1"><div class="panel" style="display:grid;gap:8px;grid-template-rows:1fr 2fr 2fr 1fr">${['HEADER','HERO','CONTENT + CTA','FOOTER'].map((x,i)=>`<button class="softbtn" onclick="anatomy(${i})" style="border-radius:10px">${x} ↗</button>`).join('')}</div><div class="panel" style="display:flex;flex-direction:column;justify-content:center"><span class="tag">НАЖМИ НА БЛОК</span><h3 id="anatomyTitle">Исследуем страницу</h3><p id="anatomyText">Выбери любую область схемы слева.</p></div></div>${foot()}`},
{type:'steps',note:'По очереди открывайте этапы. В реальных занятиях замените на шаги работы в Figma.',html:`<div class="eyebrow">05 / STEP BY STEP</div><h2>Первый макет в Figma.</h2><div class="grid3" style="flex:1">${[['01','Создай Frame','Выбери размер экрана.'],['02','Добавь текст','Создай выразительный заголовок.'],['03','Добавь формы','Собери простую композицию.']].map((a,i)=>`<div class="panel"><div class="big-number" style="font-size:clamp(45px,7vw,95px)">${a[0]}</div><h3>${a[1]}</h3><p class="small reveal" id="step${i}">${a[2]}</p><button class="softbtn" onclick="document.getElementById('step${i}').classList.toggle('show')">Показать шаг ↗</button></div>`).join('')}</div>${foot()}`},
{type:'code',note:'Редактор демонстрирует простую локальную разметку. Введённый HTML не исполняет скрипты.',html:`<div class="eyebrow">06 / LIVE CODE</div><h2>Напиши HTML. Увидь результат.</h2><div class="grid2" style="flex:1;min-height:0"><div class="code"><textarea id="htmlCode" spellcheck="false">&lt;h1&gt;Привет, дизайн!&lt;/h1&gt;\n&lt;p&gt;Это моя первая страница.&lt;/p&gt;\n&lt;button&gt;Начать&lt;/button&gt;</textarea></div><div class="panel"><span class="tag">LIVE PREVIEW</span><div class="preview" id="livePreview" style="margin-top:15px"></div><p class="tiny">Поддерживаются безопасные текстовые HTML-теги.</p></div></div>${foot('ПОПРОБУЙ ИЗМЕНИТЬ ТЕКСТ И ЗАГОЛОВОК')}`},
{type:'comparison',note:'Обсудите, когда лучше использовать каждый стиль шрифта.',html:`<div class="eyebrow">07 / COMPARISON</div><h2>Один текст. Разный характер.</h2><div class="grid2" style="flex:1"><div class="panel" style="display:flex;flex-direction:column;justify-content:center"><span class="tag">SERIF</span><div style="font:clamp(37px,6vw,85px)/1 Georgia,serif;letter-spacing:-.07em;margin:22px 0">Aa Bb<br>Design.</div><p>Классика, характер, редакционный стиль.</p></div><div class="panel" style="display:flex;flex-direction:column;justify-content:center"><span class="tag">SANS SERIF</span><div style="font-size:clamp(37px,6vw,85px);font-weight:800;line-height:1;letter-spacing:-.07em;margin:22px 0">Aa Bb<br>Design.</div><p>Современность, простота, ясность.</p></div></div>${foot()}`},
{type:'playground',note:'Попросите выбрать подходящие значения и объяснить решение.',html:`<div class="eyebrow">08 / INTERACTIVE PLAYGROUND</div><h2>Почувствуй CSS руками.</h2><div class="grid2" style="flex:1"><div class="panel"><label class="small">Скругление <b id="radiusValue">20</b> px</label><input id="radius" type="range" min="0" max="60" value="20" style="width:100%;accent-color:var(--accent)"><br><br><label class="small">Отступ <b id="paddingValue">24</b> px</label><input id="pad" type="range" min="5" max="60" value="24" style="width:100%;accent-color:var(--accent)"><br><br><label class="small">Цвет фона</label><input id="color" type="color" value="#c8b6ff" style="display:block;margin-top:10px"></div><div class="panel" style="display:grid;place-items:center"><div id="playBox" style="padding:24px;border-radius:20px;background:#c8b6ff;font-weight:800;transition:.2s">Привет, CSS ✳</div></div></div>${foot()}`},
{type:'mission',note:'Выдайте студентам практику. Галочки позволяют отмечать выполненные этапы.',html:`<div class="eyebrow">09 / MISSION CARD</div><div class="split"><div><span class="tag">MISSION 03 · FIGMA</span><h2 style="margin-top:18px">Палитра<br>для кофейни ☕</h2><p>Передай ощущение уюта всего тремя цветами.</p><div class="dots"><span class="dot" style="background:#765340;width:55px;height:55px"></span><span class="dot" style="background:#c79b72;width:55px;height:55px"></span><span class="dot" style="background:#f4e4cd;width:55px;height:55px"></span></div></div><div class="panel" style="display:flex;flex-direction:column;justify-content:center"><h3>Чек-лист миссии</h3>${['Выбрать настроение','Подобрать 3 цвета','Проверить контраст','Показать результат'].map(x=>`<label class="checkline"><input type="checkbox">${x}</label>`).join('')}</div></div>${foot('ПРАКТИКА · 15 МИНУТ')}`},
{type:'battle',note:'Пусть аудитория выберет вариант и аргументирует выбор.',html:`<div class="eyebrow">10 / DESIGN BATTLE</div><h2>Какой вариант работает лучше?</h2><div class="grid2" style="flex:1"><button class="panel" onclick="battle('A')" style="text-align:left;color:inherit"><span class="tag">ВАРИАНТ A</span><div style="background:#ffea6d;border:3px dashed #f55;padding:20px;margin:15px 0;text-align:center;color:#c11;font-family:serif;font-weight:900">КУПИТЬ! СЕЙЧАС!!!</div><p>Максимум внимания любой ценой.</p></button><button class="panel" onclick="battle('B')" style="text-align:left;color:inherit"><span class="tag">ВАРИАНТ B</span><div style="background:#f0e9ff;padding:20px;margin:15px 0;text-align:center;border-radius:16px;font-weight:800">Открой свою идею<br><span style="color:#7b5cbb">Начать →</span></div><p>Контраст, ясная иерархия, пространство.</p></button></div><p id="battleResult" class="small" aria-live="polite">Выбери один вариант.</p>${foot()}`},
{type:'mistake',note:'Кликайте на проблемные зоны, чтобы раскрывать ошибки.',html:`<div class="eyebrow">11 / SPOT THE MISTAKE</div><h2>Найди 3 ошибки макета.</h2><div class="grid2" style="flex:1"><div class="panel" style="display:flex;flex-direction:column;gap:10px"><button class="softbtn" onclick="mistake(0)" style="text-align:left;background:#d9e6ff;color:#c7d2e9">Очень слабый контраст текста</button><button class="softbtn" onclick="mistake(1)" style="text-align:left;margin-left:24%;border-radius:0">Случайное выравнивание</button><button class="softbtn" onclick="mistake(2)" style="text-align:left;font-size:clamp(8px,.7vw,10px)">Слишком мелкий важный текст</button></div><div class="panel"><span class="tag">ОБНАРУЖЕНО: <span id="mistakeCount">0</span>/3</span><h3 id="mistakeTitle" style="margin-top:20px">Нажми на подозрительную область.</h3><p id="mistakeDesc">Обсудим, как исправить ошибки.</p></div></div>${foot()}`},
{type:'quiz',note:'Правильный ответ: пользовательский опыт.',html:`<div class="eyebrow">12 / QUICK QUIZ</div><h2>Что означает UX?</h2><div style="max-width:650px">${['Уникальные эффекты','Пользовательский опыт','Язык программирования','Графический формат'].map((x,i)=>`<button class="option" onclick="quiz(this,${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}<p id="quizFeedback" class="small" aria-live="polite">Выбери один ответ.</p></div>${foot()}`},
{type:'timer',note:'Таймер 15 минут. Можно поставить паузу или сбросить.',html:`<div class="eyebrow">13 / CHALLENGE TIMER</div><div style="margin:auto;text-align:center"><span class="tag">MINI CHALLENGE</span><h2 style="margin-top:20px">Создай первый экран.</h2><div class="timer" id="timerDisplay">15:00</div><div style="display:flex;gap:12px;justify-content:center"><button class="pillbtn" id="timerToggle" onclick="toggleTimer()">Старт ▶</button><button class="softbtn" onclick="resetTimer()">Сброс ↺</button></div></div>${foot('ПРАКТИКА · РАБОТАЙ В СВОЁМ ТЕМПЕ')}`},
{type:'showcase',note:'Замените демонстрационные карточки скриншотами студенческих проектов.',html:`<div class="eyebrow">14 / PROJECT SHOWCASE</div><h2>Сделано своими руками.</h2><div class="grid3" style="flex:1">${[['#d7c4f8','COFFEE / 01','Лендинг кофейни'],['#b6e3da','STUDIO / 02','Сайт-портфолио'],['#ffd4b8','EVENT / 03','Афиша события']].map(a=>`<div class="panel" style="display:flex;flex-direction:column;gap:10px"><div style="flex:1;min-height:70px;border-radius:15px;background:${a[0]};padding:16px;display:flex;flex-direction:column;justify-content:space-between"><span class="tiny">${a[1]}</span><b style="font-size:clamp(20px,3vw,42px);letter-spacing:-.06em">Your<br>idea. ↗</b></div><b class="small">${a[2]}</b></div>`).join('')}</div>${foot()}`},
{type:'roadmap',note:'Обратите внимание на связь между блоками курса.',html:`<div class="eyebrow">15 / PROGRESS ROADMAP</div><h2>Твой путь за семестр.</h2><div class="grid2" style="flex:1">${[['01','Визуал и вау','1–5','#8b67dc'],['02','Как устроен веб','6–10','#4e86e8'],['03','UX и логика','11–15','#269b91'],['04','Финальный проект','16–25','#e77855']].map(a=>`<div class="panel" style="border-top:6px solid ${a[3]}"><span class="annotation">ЗАНЯТИЯ ${a[2]}</span><h3>${a[0]} / ${a[1]}</h3><div class="section-color" style="background:${a[3]}"></div></div>`).join('')}</div>${foot()}`},
{type:'takeaway',note:'Попросите каждого студента назвать одну вещь, которую он теперь умеет.',html:`<div class="eyebrow">16 / FINAL TAKEAWAY</div><h2>Сегодня ты научился...</h2><div class="grid3" style="flex:1">${[['✳','Видеть','Замечать решения в интерфейсах.'],['◈','Объяснять','Аргументировать выбор.'],['↗','Создавать','Превращать идею в макет.']].map(a=>`<div class="panel" style="display:flex;flex-direction:column;justify-content:center"><div class="big-number" style="font-size:clamp(45px,7vw,100px)">${a[0]}</div><h3>${a[1]}</h3><p class="small">${a[2]}</p></div>`).join('')}</div>${foot('СЛЕДУЮЩАЯ ОСТАНОВКА — FIGMA')}`},
{type:'overview',note:'Карта демонстрационного шаблона. Нажмите на тип слайда, чтобы перейти.',html:`<div class="eyebrow">17 / TEMPLATE LIBRARY</div><h2>Библиотека из 18 типов слайдов.</h2><p class="small">Нажми на карточку, чтобы перейти к нужному типу.</p><div class="navmap" id="slideMap"></div>${foot('ИЗМЕНЯЙ СОДЕРЖАНИЕ В МАССИВЕ SLIDES')}`}
];
const titles=['Cinematic Cover','Big Statement','Visual Shock','Chapter Intro','Visual Explainer','Interactive Anatomy','Step by Step','Live Code','Comparison','Interactive Playground','Mission Card','Design Battle','Spot the Mistake','Quick Quiz','Challenge Timer','Project Showcase','Progress / Roadmap','Final Takeaway','Template Library'];
let current=0,editing=false,seconds=900,timerHandle=null;const root=document.getElementById('slides'),deck=document.getElementById('deck');deck.dataset.theme=COURSE.theme;
root.innerHTML=slides.map((s,i)=>`<section class="slide" data-type="${s.type}" data-index="${i}" aria-label="${titles[i]||s.type}">${s.html}</section>`).join('');const nodes=[...document.querySelectorAll('.slide')];
function show(n){current=(n+nodes.length)%nodes.length;nodes.forEach((x,i)=>{x.classList.toggle('active',i===current);x.setAttribute('aria-hidden',i!==current)});document.getElementById('counter').textContent=`${String(current+1).padStart(2,'0')} / ${nodes.length}`;document.getElementById('progress').style.width=((current+1)/nodes.length*100)+'%';document.getElementById('note').textContent=slides[current].note||'Добавьте заметки в поле note.';if(current===7)renderCode();}
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||editing)return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}if(e.key==='Escape')document.getElementById('presenter').classList.remove('visible')});document.getElementById('fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():deck.requestFullscreen?.();document.getElementById('printBtn').onclick=()=>window.print();document.getElementById('presenterBtn').onclick=()=>document.getElementById('presenter').classList.toggle('visible');document.getElementById('motionBtn').onclick=()=>deck.classList.toggle('hide-motion');document.getElementById('editBtn').onclick=()=>{editing=!editing;deck.classList.toggle('edit-on',editing);document.querySelectorAll('.slide h1,.slide h2,.slide h3,.slide p,.slide .eyebrow').forEach(x=>{x.contentEditable=editing;x.classList.toggle('editable',editing)});document.getElementById('editBtn').style.background=editing?'#8065c7':''};document.getElementById('overview').onclick=()=>show(nodes.length-1);
function anatomy(i){const a=[['Header','Верхняя часть сайта: логотип, меню, иногда ключевое действие.'],['Hero','Первый экран: предложение, визуальный акцент и основной CTA.'],['Content + CTA','Основное содержание и призыв к целевому действию.'],['Footer','Контакты, дополнительные ссылки и служебная информация.']];document.getElementById('anatomyTitle').textContent=a[i][0];document.getElementById('anatomyText').textContent=a[i][1]}
function renderCode(){const raw=document.getElementById('htmlCode')?.value||'';const target=document.getElementById('livePreview');if(!target)return;const doc=new DOMParser().parseFromString(raw,'text/html');const allowed=new Set(['H1','H2','H3','P','B','STRONG','EM','I','UL','OL','LI','BUTTON','SPAN','BR','A']);function clean(node){if(node.nodeType===3)return document.createTextNode(node.textContent);if(node.nodeType!==1)return document.createTextNode('');if(!allowed.has(node.tagName)){const frag=document.createDocumentFragment();[...node.childNodes].forEach(x=>frag.appendChild(clean(x)));return frag}const el=document.createElement(node.tagName.toLowerCase());if(node.tagName==='A')el.removeAttribute('href');[...node.childNodes].forEach(x=>el.appendChild(clean(x)));return el}target.replaceChildren(...[...doc.body.childNodes].map(clean))}document.getElementById('htmlCode').addEventListener('input',renderCode);
for(const [id,output,prop] of [['radius','radiusValue','borderRadius'],['pad','paddingValue','padding']])document.getElementById(id).addEventListener('input',e=>{document.getElementById(output).textContent=e.target.value;document.getElementById('playBox').style[prop]=e.target.value+'px'});document.getElementById('color').addEventListener('input',e=>document.getElementById('playBox').style.background=e.target.value);
function battle(x){document.getElementById('battleResult').textContent=x==='B'?'Вариант B: ясная иерархия, читаемость и понятный CTA. Но обсуждаем аргументы, а не только вкус.':'Вариант A привлекает внимание, но мешает прочитать сообщение. Попробуй оценить читаемость и иерархию.'}
const found=new Set();function mistake(i){const a=[['Контраст','Текст слишком близок по тону к фону — его трудно прочитать.'],['Выравнивание','Случайный сдвиг разрушает визуальную сетку.'],['Размер текста','Ключевую информацию нужно сделать достаточно крупной.']];found.add(i);document.getElementById('mistakeCount').textContent=found.size;document.getElementById('mistakeTitle').textContent=a[i][0];document.getElementById('mistakeDesc').textContent=a[i][1]}
function quiz(btn,i){document.querySelectorAll('.option').forEach((b,j)=>{b.classList.toggle('correct',j===1);b.classList.toggle('wrong',j===i&&i!==1)});document.getElementById('quizFeedback').textContent=i===1?'Верно! UX = User Experience, пользовательский опыт.':'Не совсем. UX — это пользовательский опыт.'}
function paintTimer(){document.getElementById('timerDisplay').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}function toggleTimer(){if(timerHandle){clearInterval(timerHandle);timerHandle=null;document.getElementById('timerToggle').textContent='Продолжить ▶';return}document.getElementById('timerToggle').textContent='Пауза ‖';timerHandle=setInterval(()=>{seconds=Math.max(0,seconds-1);paintTimer();if(!seconds){clearInterval(timerHandle);timerHandle=null;document.getElementById('timerToggle').textContent='Готово ✓'}},1000)}function resetTimer(){clearInterval(timerHandle);timerHandle=null;seconds=900;paintTimer();document.getElementById('timerToggle').textContent='Старт ▶'}
document.getElementById('slideMap').innerHTML=slides.map((s,i)=>`<button onclick="show(${i})"><b>${String(i+1).padStart(2,'0')}</b><br>${titles[i]||s.type}</button>`).join('');show(0);
</script></body></html>
